server:
  port: 8080

spring:
  application:
    name: moka-agent

  # 默认关闭 AgentScope Spring Boot Starter 自带的 LLM 自动配置，
  # 由本项目的 ModelConfig 统一注入 DashScope 模型 Bean。
  autoconfigure:
    exclude:
      - io.agentscope.spring.boot.starter.autoconfigure.AgentscopeAutoConfiguration

agentscope:
  dashscope:
    # 申请地址：https://dashscope.console.aliyun.com/apiKey
    # 启动前请通过环境变量 DASHSCOPE_API_KEY 注入，或在此处直接填写
    api-key: ${DASHSCOPE_API_KEY:}

logging:
  level:
    com.moka.agent: INFO
    io.agentscope: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
